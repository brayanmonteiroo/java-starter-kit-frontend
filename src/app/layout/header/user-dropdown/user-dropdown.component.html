<div class="relative">
  <!-- User Button -->
  <button app-button variant="unstyled"
    class="dropdown-toggle flex items-center text-gray-700 dark:text-gray-400"
    (click)="toggleDropdown($event)"
    type="button"
  >
    <span
      class="me-3 flex size-11 shrink-0 items-center justify-center rounded-lg bg-brand-50 text-sm font-semibold text-brand-500 dark:bg-brand-500/15 dark:text-brand-400"
      aria-hidden="true"
    >
      {{ initials }}
    </span>

    <span class="me-1 block text-sm font-medium">{{ auth.currentUser()?.name || 'Usuário' }}</span>

    <svg
      class="size-5 text-gray-500 duration-200 dark:text-gray-400"
      [ngClass]="isOpen ? 'rotate-180' : 'rotate-0'"
      width="20"
      height="20"
      viewBox="0 0 20 20"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </button>

  @if (isOpen) {
    <div
      class="absolute end-0 mt-3 z-50 flex w-65 flex-col gap-1 rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg outline-none dark:border-gray-800 dark:bg-[#1E2635]"
    >
      <div class="px-3 py-2">
        <span class="block text-sm font-medium text-gray-700 dark:text-gray-400">
          {{ auth.currentUser()?.name || 'Usuário' }}
        </span>
        <span class="mt-0.5 block text-xs text-gray-500 dark:text-gray-400">
          {{ auth.currentUser()?.email || '' }}
        </span>
      </div>

      <div class="-mx-3 my-1.5 h-px bg-gray-100 dark:bg-gray-700"></div>

      <a
        routerLink="/meu-perfil"
        (click)="closeDropdown()"
        class="group/dropdown-menu-item relative flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-gray-700 outline-hidden transition-colors duration-200 select-none hover:bg-gray-100 hover:text-gray-800 dark:text-gray-300 dark:hover:bg-white/5 dark:hover:text-white"
      >
        <svg
          class="size-5 shrink-0 text-gray-500 dark:text-gray-400"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M19 21v-2a4 4 0 00-4-4H9a4 4 0 00-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
        Meu perfil
      </a>

      <a
        href="#"
        (click)="logout($event)"
        class="group/dropdown-menu-item relative flex cursor-pointer items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium text-red-500 outline-hidden transition-colors duration-200 select-none hover:bg-red-50 hover:text-red-600 focus:bg-red-50 focus:text-red-600 dark:text-red-400 dark:hover:bg-red-500/10 dark:hover:text-red-400"
      >
        <svg
          class="size-5 shrink-0 text-red-500 pointer-events-none dark:text-red-400"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M4 12h7.75M8 8l-3.998 4 3.997 4M9.75 4.996V4.25a1.5 1.5 0 011.5-1.5h6a1.5 1.5 0 011.5 1.5v15.5a1.5 1.5 0 01-1.5 1.5h-6a1.5 1.5 0 01-1.5-1.5V19"
          />
        </svg>
        Sair
      </a>
    </div>
  }
</div>
